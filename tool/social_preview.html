<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 1280px;
      height: 640px;
      overflow: hidden;
      background-color: #0A1128;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      position: relative;
      width: 1280px;
      height: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, rgba(147, 197, 114, 0.15) 0%, rgba(10, 17, 40, 0.95) 60%, #0A1128 100%);
      border: 1px solid rgba(147, 197, 114, 0.25);
    }
    .glow-ring {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(147, 197, 114, 0.18) 0%, rgba(10, 17, 40, 0) 70%);
      top: 100px;
      pointer-events: none;
    }
    .logo-container {
      position: relative;
      z-index: 2;
      margin-bottom: 24px;
    }
    .logo-img {
      width: 170px;
      height: 170px;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.5));
    }
    .title {
      z-index: 2;
      font-size: 72px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -1.5px;
      margin-bottom: 12px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.4);
    }
    .subtitle {
      z-index: 2;
      font-size: 30px;
      font-weight: 600;
      color: #93C572;
      letter-spacing: 0.5px;
      margin-bottom: 32px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .badge-bar {
      z-index: 2;
      display: flex;
      gap: 16px;
    }
    .badge {
      background: rgba(147, 197, 114, 0.12);
      border: 1px solid rgba(147, 197, 114, 0.35);
      color: #E2E8F0;
      font-size: 16px;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }
    .corner-decor {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 2px solid rgba(147, 197, 114, 0.4);
    }
    .tl { top: 24px; left: 24px; border-right: none; border-bottom: none; }
    .tr { top: 24px; right: 24px; border-left: none; border-bottom: none; }
    .bl { bottom: 24px; left: 24px; border-right: none; border-top: none; }
    .br { bottom: 24px; right: 24px; border-left: none; border-top: none; }
  </style>
</head>
